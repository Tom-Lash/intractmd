<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>IntractMD™</title>

<!-- PWA Meta -->
<meta name="application-name" content="IntractMD"/>
<meta name="theme-color" content="#0B1F3A"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="IntractMD"/>
<meta name="description" content="AI-powered drug interaction and polypharmacy risk platform by Resolve Medical, LLC"/>

<!-- Icons -->
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png"/>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1F3A;
  --cyan:#00B4D8;
  --green:#2E7D52;
  --purple:#534AB7;
  --amber:#D97706;
  --white:#FFFFFF;
  --bg:#F4F7FA;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--navy);
  color:var(--white);
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
}

/* Header */
.app-header{
  background:var(--navy);
  padding:env(safe-area-inset-top, 16px) 20px 14px;
  padding-top:calc(env(safe-area-inset-top, 0px) + 14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.app-logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.app-logo-icon{
  width:34px;
  height:34px;
  background:rgba(0,180,216,.15);
  border:1.5px solid rgba(0,180,216,.4);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app-logo-icon svg{width:20px;height:20px}
.app-logo-text{
  font-size:18px;
  font-weight:700;
  color:var(--cyan);
  letter-spacing:-.02em;
}
.app-logo-text sup{font-size:10px;vertical-align:super;color:rgba(0,180,216,.7)}
.app-logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
.app-user{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:rgba(255,255,255,.5);
}
.logout-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  color:rgba(255,255,255,.6);
  font-size:11px;
  font-family:'Inter',sans-serif;
  padding:4px 10px;
  cursor:pointer;
}
.logout-btn:hover{background:rgba(255,255,255,.15)}

/* Main content iframe */
.app-frame{
  flex:1;
  width:100%;
  border:none;
  background:var(--bg);
  overflow:hidden;
}

/* Bottom nav */
.bottom-nav{
  display:flex;
  background:var(--navy);
  border-top:1px solid rgba(255,255,255,.1);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  flex-shrink:0;
}
.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px 4px 8px;
  cursor:pointer;
  border:none;
  background:none;
  color:rgba(255,255,255,.4);
  font-family:'Inter',sans-serif;
  transition:color .15s;
  position:relative;
}
.nav-item.active{color:var(--white)}
.nav-item.active::before{
  content:'';
  position:absolute;
  top:0;left:20%;right:20%;
  height:2px;
  border-radius:0 0 2px 2px;
  background:var(--cyan);
}
.nav-item:nth-child(2).active::before{background:var(--green)}
.nav-item:nth-child(3).active::before{background:var(--purple)}
.nav-item:nth-child(4).active::before{background:var(--amber)}
.nav-icon{font-size:22px;line-height:1;margin-bottom:3px}
.nav-label{font-size:10px;font-weight:500;letter-spacing:.01em}

/* Splash/loading */
.splash{
  position:fixed;inset:0;
  background:var(--navy);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
  z-index:100;
  transition:opacity .4s;
}
.splash.hidden{opacity:0;pointer-events:none}
.splash-logo{
  width:80px;height:80px;
  background:rgba(0,180,216,.15);
  border:2px solid rgba(0,180,216,.4);
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
}
.splash-title{font-size:28px;font-weight:700;color:var(--cyan);letter-spacing:-.02em}
.splash-sub{font-size:13px;color:rgba(255,255,255,.4)}
.splash-spinner{
  width:28px;height:28px;
  border:2.5px solid rgba(0,180,216,.2);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Splash screen -->
<div class="splash" id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 40 40" width="44" height="44" fill="none">
      <path d="M20 4 L36 34 L4 34 Z" fill="none" stroke="#00B4D8" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20 14 L28 30 L12 30 Z" fill="none" stroke="rgba(0,180,216,.35)" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="20" cy="4" r="2.5" fill="#00B4D8"/>
    </svg>
  </div>
  <div>
    <div class="splash-title">IntractMD™</div>
    <div class="splash-sub">by Resolve Medical, LLC</div>
  </div>
  <div class="splash-spinner"></div>
</div>

<!-- App header -->
<div class="app-header">
  <div class="app-logo">
    <div class="app-logo-icon">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 4 L36 34 L4 34 Z" fill="none" stroke="#00B4D8" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="20" cy="4" r="2.5" fill="#00B4D8"/>
      </svg>
    </div>
    <div>
      <div class="app-logo-text">IntractMD<sup>™</sup></div>
      <div class="app-logo-sub">Resolve Medical, LLC</div>
    </div>
  </div>
  <div class="app-user">
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</div>

<!-- Content frame -->
<iframe class="app-frame" id="appFrame" src="" allowfullscreen></iframe>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <button class="nav-item" id="nav-proactive" onclick="navigate('proactive')">
    <span class="nav-icon"><i class="ti ti-shield-search"></i></span>
    <span class="nav-label">Proactive</span>
  </button>
  <button class="nav-item" id="nav-clinical" onclick="navigate('clinical')">
    <span class="nav-icon"><i class="ti ti-stethoscope"></i></span>
    <span class="nav-label">Clinical</span>
  </button>
  <button class="nav-item" id="nav-deprescribing" onclick="navigate('deprescribing')">
    <span class="nav-icon"><i class="ti ti-trending-down"></i></span>
    <span class="nav-label">Deprescribing</span>
  </button>
</nav>

<script>
// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(console.error);
}

const frame = document.getElementById('appFrame');
const splash = document.getElementById('splash');
let currentSurface = null;

// Surfaces config
const SURFACES = {
  proactive:     { url: '/proactive',     nav: 'nav-proactive' },
  clinical:      { url: '/clinical',      nav: 'nav-clinical' },
  deprescribing: { url: '/deprescribing', nav: 'nav-deprescribing' },
};

function navigate(surface) {
  if (currentSurface === surface) return;
  currentSurface = surface;

  // Update nav active state
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(SURFACES[surface].nav).classList.add('active');

  // Load surface in iframe
  frame.src = SURFACES[surface].url;
}

function logout() {
  if (confirm('Sign out of IntractMD?')) {
    window.location.href = '/logout';
  }
}

// Handle iframe navigation — if it lands on /login, redirect whole app
frame.addEventListener('load', function() {
  try {
    const iUrl = frame.contentWindow.location.href;
    if (iUrl.includes('/login')) {
      window.location.href = '/login?next=/app';
    }
  } catch(e) {
    // Cross-origin — ignore
  }
  // Hide splash after first load
  splash.classList.add('hidden');
});

// Determine start surface from URL param or default to proactive
const params = new URLSearchParams(window.location.search);
const startSurface = params.get('surface') || 'proactive';
navigate(startSurface);

// Hide splash after 3s max regardless
setTimeout(() => splash.classList.add('hidden'), 3000);
</script>
</body>
</html>
